name: CI

on:
  # Every branch push, rather than `pull_request`. A restack pushes a stacked
  # PR's head and its base branch together, and `pull_request` answers that pair
  # with two runs at the new head. `push` starts one run per pushed branch, and
  # the required `check` is read from the PR's head commit whichever event
  # produced it. The `'**'` pattern excludes tags.
  push:
    branches: ['**']

# A newer push to a branch cancels that branch's in-progress run. The cancelled
# run's commit is no longer the branch head, so its failing `check` lands on a
# commit no PR reads. Main keys each run on its run id instead, so every commit
# on main is checked to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

# Each gate is its own job, so they run in parallel and the run takes as long as
# its slowest gate rather than the sum of all of them. `check` at the bottom
# collects their results and is the one required status check.
#
# Every code gate below gates on `!cancelled()` rather than on `needs`-success:
# a failed doc-reference check must not skip them all, or one run stops
# reporting every error it found. The flag is still set in that case, because
# `repo_checks` runs its filter step on failure too.
jobs:
  # The checks that need no build toolchain, plus the code-changed flag every
  # other job gates on. Nothing here depends on the flag: a docs-only PR is
  # exactly when a section anchor rots, so the doc-reference check has to run
  # on it.
  repo_checks:
    runs-on: ubuntu-latest
    outputs:
      is_code_change: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Full-history fetch of all refs so the pre-rewrite tripwire below
          # sees every commit reachable from the repo, not just the PR head.
          # The other jobs take the default shallow checkout; this is the only
          # gate that reads history.
          fetch-depth: 0

      # This repo was recreated from filter-rewritten history; cbf7ce76 is the
      # tip of the retired pre-rewrite history (kept in cambra-dev/cambra-old).
      # If that commit is present, someone pushed a ref based on the old
      # history, which would republish the content the rewrite removed. Fail
      # before anything else runs.
      - name: Refuse pre-rewrite history
        run: |
          if git cat-file -e cbf7ce7624005647b6c019e1651dca9806b9738e 2>/dev/null; then
            echo "::error::Pre-rewrite history detected: commit cbf7ce76 is reachable from a ref in this repo (possibly this PR). Rebase the offending branch onto the rewritten main and delete any ref that carries the old history."
            exit 1
          fi

      # Validate intra-repo doc references (Markdown links/anchors + code->doc
      # citations). Needs only python3, present on the runner.
      - name: Doc references
        if: success() || failure()
        run: ./ci.sh doc_refs

      # Gate the interpreter's no-back-channel invariant (operators exchange
      # tiles through `get`, never through shared mutable state). Python-only
      # like the doc-ref check.
      - name: Shared state
        if: success() || failure()
        run: ./ci.sh shared_state

      # Skip the code gates for changes that touch no code. Runs last so a
      # failure above cannot leave the flag unset. On a branch push the filter
      # diffs against the merge-base with main, so a docs-only PR stacked on
      # code PRs runs the gates; on main it diffs against the commit before the
      # push. Both come from git history, which the full fetch above provides.
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filter
        if: success() || failure()
        with:
          # A file is code only if it matches every pattern, so each negation
          # excludes its files. Under the default `some` one match is enough,
          # and every file matches some negation (a `.md` file matches
          # `!LICENSE`), so every change would count as code.
          predicate-quantifier: 'every'
          filters: |
            code:
              - '!**/*.md'
              - '!LICENSE'
              - '!docs/**'

  # Lints the crate with `--all-targets` in debug — the baseline pass. Its own
  # job because each clippy configuration is a distinct fingerprint: cargo
  # rebuilds for every one of them, so running them together only makes them
  # queue.
  clippy:
    needs: repo_checks
    if: ${{ !cancelled() && needs.repo_checks.outputs.is_code_change == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/rust
      - name: Clippy
        run: ./ci.sh clippy

  # The same lint in release, which is the only pass that compiles the test
  # target in release — so a `#[cfg(debug_assertions)]`-gated item referenced by
  # ungated code (a test calling a debug-only fn) breaks here and nowhere else.
  clippy_release:
    needs: repo_checks
    if: ${{ !cancelled() && needs.repo_checks.outputs.is_code_change == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/rust
      - name: Clippy (release)
        run: ./ci.sh clippy_release

  # The checks that finish in seconds, kept together because three more runners
  # would cost more setup than the work they do.
  lint:
    needs: repo_checks
    if: ${{ !cancelled() && needs.repo_checks.outputs.is_code_change == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/rust

      # Every step below runs even if an earlier one failed, so one run reports
      # every error rather than only the first. Steps default to
      # `if: success()`, which skips on prior failure.
      # https://docs.github.com/en/actions/reference/workflows-and-actions/expressions#status-check-functions
      - name: Shellcheck
        run: ./ci.sh shellcheck

      - name: Format
        if: success() || failure()
        run: ./ci.sh fmt

      - name: Clippy (lib only)
        # Both passes above use `--all-targets`, which unifies the *self*
        # dev-dependency's `test-helpers` feature into the lib under test — so
        # they only ever compile the library with that feature ON, and the
        # feature-off configuration a consumer builds is compiled by nothing.
        # Resolver 3 keeps the feature out of a plain lib build, so the gap is
        # silent: ungated code calling a gated item passes both and fails
        # `cargo build --lib`.
        if: success() || failure()
        run: ./ci.sh clippy_lib

      - name: Doc
        # Builds rustdoc with broken intra-doc links denied, which is what makes
        # a `[`identifier`]` reference in a doc comment a checkable citation
        # rather than prose that rots silently.
        if: success() || failure()
        run: ./ci.sh doc

  # Both test orders use the same binaries. Optimizing the workspace crates
  # adds compile time once and reduces execution time in both jobs.
  build_tests:
    needs: repo_checks
    if: ${{ !cancelled() && needs.repo_checks.outputs.is_code_change == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/rust
        with:
          # Reuse the dependency cache populated under the `test` job ID.
          cache-key: test
          shared-tests: "true"

      - name: Build optimized tests
        run: cargo --config "$RUNNER_TEMP/cambra-test-profile.toml" test --workspace --no-run

      - name: Pack Cargo build
        run: |
          tar --use-compress-program='zstd -T0 -1' -cf "$RUNNER_TEMP/test-build.tar.zst" \
            --exclude=target/debug/incremental Cargo.lock target/debug target/.rustc_info.json

      - name: Upload Cargo build
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rust-test-build-${{ github.run_attempt }}
          path: ${{ runner.temp }}/test-build.tar.zst
          compression-level: 0
          if-no-files-found: error
          retention-days: 2

  # The normal suite checks provenance throughout the corpus. The reversed
  # suite checks that refinement-set insertion order stays unobservable.
  test:
    name: ${{ matrix.job }}
    needs: build_tests
    if: ${{ !cancelled() && needs.build_tests.outputs.artifact_id != '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - job: test
            gate: CAMBRA_PROVENANCE_GATE=1
          - job: test_reversed
            gate: CAMBRA_REFINEMENT_ORDER=reverse
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/rust
        with:
          cache-key: test
          shared-tests: "true"

      - name: Download Cargo build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.build_tests.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}

      - name: Unpack Cargo build
        run: tar --zstd -xf "$RUNNER_TEMP/test-build.tar.zst"

      - name: Test
        env:
          TEST_GATE: ${{ matrix.gate }}
        run: |
          env "$TEST_GATE" cargo --config "$RUNNER_TEMP/cambra-test-profile.toml" test \
            --workspace --locked -q --no-fail-fast

  # The no-assertions profile compiles with `debug_assertions` disabled and
  # has its own build and cache entry.
  test_no_assertions:
    needs: repo_checks
    if: ${{ !cancelled() && needs.repo_checks.outputs.is_code_change == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/rust

      - name: Test (no debug assertions)
        run: ./ci.sh test_no_assertions

  # The Lean model: `lake build` elaborates every theorem and evaluates every
  # `#guard`, then the differential tests diff the model's verdicts against the
  # solver's. Those tests skip themselves when the oracle binary is absent, so
  # without this gate nothing notices the model drifting from the solver, in
  # either direction.
  formal:
    needs: repo_checks
    if: ${{ !cancelled() && needs.repo_checks.outputs.is_code_change == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/rust

      - uses: ./.github/actions/lean

      - name: Formal model
        run: ./ci.sh formal

  # The golden wire fixtures: regenerate into a temp dir and diff against the
  # committed corpus, plus the orphan-fixture check. Its own job because
  # `regen-fixtures.sh` drives a bare `cargo run`, which resolves without the
  # self dev-dependency and so builds the `test-helpers`-off configuration —
  # a different build from the one the suite compiles, sharing nothing with it.
  fixtures:
    needs: repo_checks
    if: ${{ !cancelled() && needs.repo_checks.outputs.is_code_change == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/rust
      - name: Fixtures
        run: ./ci.sh fixtures

  # The frontend: typecheck + vitest + committed-bundle freshness. Needs Node
  # and no Rust, so it shares none of the setup above.
  web:
    needs: repo_checks
    if: ${{ !cancelled() && needs.repo_checks.outputs.is_code_change == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # TODO: pin to a SHA to match this repo's action-pinning convention.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4
        with:
          node-version: 20

      - name: Web
        run: ./ci.sh web

  # The editor grammars against the lexer's highlight spans, and each editor's
  # indentation against the shared cases. The span dump is a Rust example and
  # the checkers run under Node and Neovim, so this needs both toolchains; no
  # other job has them together. A missing toolchain fails the
  # gate under CI rather than skipping it.
  editors:
    needs: repo_checks
    if: ${{ !cancelled() && needs.repo_checks.outputs.is_code_change == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/rust

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4
        with:
          node-version: 20

      # A release tarball pinned by version and verified by hash, like z3 in the
      # Rust action, rather than Ubuntu's older apt package: the Neovim the
      # syntax file is checked under changes only with a commit.
      - name: Setup Neovim
        run: |
          curl -sSfL -o /tmp/nvim.tar.gz \
            https://github.com/neovim/neovim/releases/download/v0.11.6/nvim-linux-x86_64.tar.gz
          echo "2fc90b962327f73a78afbfb8203fd19db8db9cdf4ee5e2bef84704339add89cc  /tmp/nvim.tar.gz" \
            | sha256sum -c -
          tar xzf /tmp/nvim.tar.gz -C /tmp
          echo "/tmp/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Editor highlight check and indentation tests
        run: ./ci.sh editors

      # Downloads the VS Code version `ci_vscode` pins on every run. Not cached:
      # `.vscode-test/` unpacks to about 1 GB, which restores no faster than the
      # download and would crowd the repository's Actions cache.
      - name: Language server through VS Code's client
        run: ./ci.sh vscode

  # The one required status check: ruleset "CI" requires the context `check`.
  # Keeping that name on a job that only collects results is what lets the gates
  # above be split, renamed, or added to without a ruleset edit.
  check:
    needs: [repo_checks, lint, clippy, clippy_release, build_tests, test, test_no_assertions, formal, fixtures, web, editors]
    # `always()` so this runs when a gate failed; without it the job would be
    # skipped and the required check would never report.
    if: always()
    runs-on: ubuntu-latest
    steps:
      # A docs-only PR skips the code gates, and `skipped` is not a failure.
      # `cancelled` is, because a cancelled gate checked nothing.
      - name: No-op for docs
        if: needs.repo_checks.outputs.is_code_change == 'false'
        run: echo "Only documentation changed. The code gates were skipped."

      - name: Collect gate results
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        # Through the environment, not interpolated into the command: the JSON
        # is multi-line and would otherwise be spliced into the shell.
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "${RESULTS}"
          echo "::error::A CI gate did not pass; see the results above."
          exit 1

      - name: Notify Slack on failure
        # Only notify on main. Every branch push runs this workflow, so the
        # ref, not the event, is what identifies main.
        if: >-
          failure() && github.ref == 'refs/heads/main' &&
          needs.repo_checks.outputs.is_code_change == 'true'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ vars.SLACK_CI_CHANNEL }}
        run: |
          curl -sf -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg channel "$SLACK_CHANNEL" \
              --arg text ":red_circle: CI failed on main — <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>" \
              '{channel: $channel, text: $text}')"
