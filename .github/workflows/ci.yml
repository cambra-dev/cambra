name: CI

on:
  push:
    branches: [main]
  pull_request: # Trigger on all PRs to satisfy branch protection
    types: [opened, synchronize, reopened]

# Group runs by workflow + PR branch (head_ref) so duplicate runs (e.g. from
# git-spice force-pushing twice) cancel the earlier one. head_ref is empty on
# pushes to main, so those fall back to run_id and are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read
  # Permissions to see changed files for the paths-filter action below.
  pull-requests: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Full-history fetch of all refs so the pre-rewrite tripwire below
          # sees every commit reachable from the repo, not just the PR head.
          fetch-depth: 0

      # This repo was recreated from filter-rewritten history; cbf7ce76 is the
      # tip of the retired pre-rewrite history (kept in cambra-dev/cambra-old).
      # If that commit is present, someone pushed a ref based on the old
      # history, which would republish the content the rewrite removed. Fail
      # before anything else runs.
      - name: Refuse pre-rewrite history
        run: |
          if git cat-file -e cbf7ce7624005647b6c019e1651dca9806b9738e 2>/dev/null; then
            echo "::error::Pre-rewrite history detected: commit cbf7ce76 is reachable from a ref in this repo (possibly this PR). Rebase the offending branch onto the rewritten main and delete any ref that carries the old history."
            exit 1
          fi

      # Validate intra-repo doc references (Markdown links/anchors + code->doc
      # citations). Deliberately runs on EVERY PR — including docs-only ones,
      # which the paths-filter below marks as `code: false` and otherwise skips,
      # yet are exactly when section anchors rot. Needs only python3 (present on
      # the runner), no Rust toolchain, so it runs before setup.
      - name: Doc references
        run: ./ci.sh doc_refs

      # Gate the interpreter's no-back-channel invariant (operators exchange
      # tiles through `get`, never through shared mutable state). Python-only
      # like the doc-ref check, so it runs here rather than behind the toolchain
      # setup, and ahead of the paths filter below so it cannot be skipped.
      - name: Shared state
        run: ./ci.sh shared_state

      # 1. Detect if changes are only in ignored paths
      # Skip CI for changes that don't affect code
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36
        id: filter
        with:
          filters: |
            code:
              - '!**/*.md'
              - '!LICENSE'
              - '!docs/**'
              # Catch-all: run for everything else
              - '**'

      # 2. Setup Toolchain (Only if code changed)
      - name: Setup Rust
        if: steps.filter.outputs.code == 'true'
        uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable as of 2026-02-05
        with:
          components: rustfmt, clippy

      - name: Cache
        if: steps.filter.outputs.code == 'true'
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2

      # The Lean development in `formal/` is checked by *building* it: `lake
      # build` elaborates every theorem and evaluates every `#guard`, so without
      # a toolchain on the runner the `Formal model` step below would skip and
      # gate nothing. elan is pinned by release and verified by hash, the same
      # discipline as pinning the actions above by SHA, and it installs the
      # version `formal/lean-toolchain` names rather than a floating one.
      - name: Setup Lean
        if: steps.filter.outputs.code == 'true'
        run: |
          curl -sSfL -o /tmp/elan.tar.gz \
            https://github.com/leanprover/elan/releases/download/v4.2.3/elan-x86_64-unknown-linux-gnu.tar.gz
          echo "df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2  /tmp/elan.tar.gz" \
            | sha256sum -c -
          tar xzf /tmp/elan.tar.gz -C /tmp
          /tmp/elan-init -y --default-toolchain "$(cat formal/lean-toolchain)" >/dev/null
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # 3. Run Checks (Only if code changed)
      - name: Shellcheck
        if: steps.filter.outputs.code == 'true'
        run: ./ci.sh shellcheck

      # Workaround: rustpython-parser v0.2.0's build script generates a source
      # file (python.rs) outside target/. rust-cache restores compiled artifacts
      # but not that generated file, so clippy/test fail with a missing include.
      # Cleaning the package forces its build script to re-run every time.
      - name: Clean rustpython-parser cache
        run: cargo clean -p rustpython-parser 2>/dev/null || true

      - name: Format
        if: steps.filter.outputs.code == 'true' && (success() || failure())
        run: ./ci.sh fmt

      - name: Clippy
        # Run even if earlier steps failed so we see all errors in one run.
        # (Steps default to `if: success()`, which skips on prior failure.)
        #
        # An alternative would be to split this into multiple jobs (e.g. check -> execute -> results),
        # but then we pay a (small) latency overhead for staring up 3 runners.
        #
        # Read more about the "hidden ifs" and general inanity here
        # https://docs.github.com/en/actions/reference/workflows-and-actions/expressions#status-check-functions
        if: steps.filter.outputs.code == 'true' && (success() || failure())
        run: ./ci.sh clippy

      - name: Clippy (release)
        # Lints all targets — including the test target — in release. The debug
        # checks never compile tests in release, so debug-only gating that
        # breaks release builds (a `#[cfg(debug_assertions)]` item referenced by
        # ungated code) only surfaces here. Runs even if earlier steps failed.
        if: steps.filter.outputs.code == 'true' && (success() || failure())
        run: ./ci.sh clippy_release

      - name: Clippy (serde feature)
        # The `serde` feature is default-OFF, so every pass above compiles zero
        # serde — including the hand-written `Serialize` impls for the inspector
        # wire types. Without this step that code is compiled by nobody.
        if: steps.filter.outputs.code == 'true' && (success() || failure())
        run: ./ci.sh clippy_serde

      - name: Clippy (lib only)
        # Every pass above uses `--all-targets`, which unifies the *self*
        # dev-dependency's `test-helpers` feature into the lib under test — so
        # they only ever compile the library with that feature ON, and the
        # feature-off configuration a consumer builds is compiled by nothing.
        # Resolver 3 keeps the feature out of a plain lib build, so the gap is
        # silent: ungated code calling a gated item passes everything above and
        # fails `cargo build --lib`.
        if: steps.filter.outputs.code == 'true' && (success() || failure())
        run: ./ci.sh clippy_lib

      - name: Doc
        # Builds rustdoc with broken intra-doc links denied, which is what makes
        # a `[`identifier`]` reference in a doc comment a checkable citation
        # rather than prose that rots silently.
        if: steps.filter.outputs.code == 'true' && (success() || failure())
        run: ./ci.sh doc

      - name: Formal model
        # Builds the Lean model, which is what checks its proofs, then diffs the
        # model's verdicts against the solver's. Placed before `Test` so the
        # oracle binary exists by the time the suite runs: the differential tests
        # skip themselves without it, and skipping is the failure mode this step
        # exists to remove.
        if: steps.filter.outputs.code == 'true' && (success() || failure())
        run: ./ci.sh formal

      - name: Test
        # Run even if earlier steps failed so we see all errors in one run.
        # (Steps default to `if: success()`, which skips on prior failure.)
        #
        # An alternative would be to split this into multiple jobs (e.g. check -> execute -> results),
        # but then we pay a (small) latency overhead for staring up 3 runners.
        #
        # Read more about the "hidden ifs" and general inanity here
        # https://docs.github.com/en/actions/reference/workflows-and-actions/expressions#status-check-functions
        if: steps.filter.outputs.code == 'true' && (success() || failure())
        # Enable the opt-in per-operation typecheck (the `deep-typecheck`
        # feature) in automated runs so it keeps guarding against a pass that
        # produces an ill-typed tree — it is off by default locally because it is
        # superlinear on nested comprehensions (see `ci_test` / `debug_typecheck`).
        # `CAMBRA_PROVENANCE_GATE=1` makes every compile fold every gated pane pair
        # and gate the leak classes, so the gate's corpus is the whole test suite
        # rather than the handful of programs `context.rs`'s `corpus()` lists. Two
        # recording gaps lived outside that sample; measured at ~+4% on the test
        # step, which is worth paying to keep the next one from doing the same.
        run: DEEP_TYPECHECK=1 CAMBRA_PROVENANCE_GATE=1 ./ci.sh test

      - name: Test (reversed refinement order)
        if: steps.filter.outputs.code == 'true' && (success() || failure())
        # A refinement set is unordered by contract, but two classes of
        # order-dependence survive a compile-clean rewrite and only running the
        # suite both ways exercises them: a consumer that iterates the set and
        # lets the order reach something observable, and a dedup that keeps the
        # first-inserted of two `eq`-equal refinements whose predicate terms carry
        # different embedded type slots. Nothing in the type system catches
        # either, so an unrun knob would rot exactly as an uncompiled feature
        # does. The env var is read at *runtime*, so this reuses the binaries
        # the step above already built.
        run: CAMBRA_REFINEMENT_ORDER=reverse ./ci.sh test

      - name: Inspector
        # The cambra-inspector crate (lints + tests). Separate from the core
        # `cargo` checks, which only build the root package. Runs even if earlier
        # steps failed so all errors surface in one run.
        if: steps.filter.outputs.code == 'true' && (success() || failure())
        run: ./ci.sh inspector

      - name: Fixtures
        # The golden wire fixtures: regenerate into a temp dir and diff against
        # the committed corpus, plus the orphan-fixture check. Needs its own step
        # because CI invokes each gate individually and never calls `ci_all`, so
        # a gate that exists only in `ci.sh` runs locally and nowhere else.
        if: steps.filter.outputs.code == 'true' && (success() || failure())
        run: ./ci.sh fixtures

        # 4. Success Signal for noops
      - name: No-op for docs
        if: steps.filter.outputs.code == 'false'
        run: echo "Only documentation changed. Skipped CI checks."

      - name: Notify Slack on failure
        # failure() is true if *any* previous step failed, even if later steps
        # succeeded, so this fires regardless of which check caught the error.
        #
        # Only notify on pushes to main, not PRs. The push trigger is scoped
        # to branches: [main], so event_name == 'push' implies main. PR branch
        # pushes fire as 'pull_request' events instead.
        #
        # Only fire if this is a run with codechanges.
        if: failure() && github.event_name == 'push' && steps.filter.outputs.code == 'true'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ vars.SLACK_CI_CHANNEL }}
        run: |
          curl -sf -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg channel "$SLACK_CHANNEL" \
              --arg text ":red_circle: CI failed on main — <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>" \
              '{channel: $channel, text: $text}')"
