[package]
name = "cambra-inspector"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

# The user-facing program-inspector: HTTP server (tiny_http) + embedded
# CodeMirror frontend, serving the read-only payload from
# `cambra::inspector_model`. This crate owns serde + the JS toolchain so the
# `cambra` core stays serde-free.

[dependencies]
cambra = { path = "..", features = ["serde"] }
# The transport-edge serializer. serde_json lives HERE, never on `cambra` — the
# core builds the (serde-gated) wire types; this crate turns them into JSON.
serde_json = "1"
# The user-facing inspector HTTP server. Same version as the `cambra` core's
# web_inspector dev dashboard, but a separate, sibling server living here.
tiny_http = "0.12"

[dev-dependencies]
# Embedded CHL programs keep their own indentation; an off-side-rule language
# cannot be written with escaped newlines.
indoc = "1.0"
