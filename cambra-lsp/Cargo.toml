[package]
name = "cambra-lsp"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Language server for the Cambra High-level Language (CHL)"
repository = "https://github.com/cambra-dev/cambra"

[dependencies]
chl-parser = { path = "../chl-parser" }
lsp-server = "0.10"
lsp-types = { package = "gen-lsp-types", version = "0.11", features = ["url"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smol_str = "0.3.6"

[dev-dependencies]
indoc = "1.0"
