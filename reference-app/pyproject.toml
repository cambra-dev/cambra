[project]
name = "storefront-reference"
version = "0.1.0"
description = "The storefront north-star on a conventional stack, for the Cambra line-count comparison"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "sqlalchemy[asyncio]==2.0.52",
    "asyncpg==0.31.0",
    "alembic==1.19.1",
    "temporalio==1.32.0",
    "aiokafka==0.14.0",
    "duckdb==1.5.5",
    "pyarrow==25.0.1",
    "httpx==0.28.1",
    "structlog==26.1.0",
    "prometheus-client==0.24.1",
    "opentelemetry-sdk==1.44.0",
    "opentelemetry-exporter-otlp-proto-http==1.44.0",
    "opentelemetry-instrumentation-fastapi==0.65b0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.5",
]

[tool.setuptools.packages.find]
include = ["storefront*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# One event loop for the whole session: the SQLAlchemy engine is module-level
# and its pooled connections belong to the loop that opened them.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
