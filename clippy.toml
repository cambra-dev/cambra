# An inference error carries two `Type`s, and a function type carries its effects, which puts
# `LocatedInferError` at 144 bytes.
large-error-threshold = 152

# `WitnessId` hashes and orders on `(spelling, uid, position)` — plain integers. A
# `Pending` reaches a `FunKindVar`'s `RefCell` through an `Rc`, and nothing that keys a
# set or map ever reads it, so the interior mutability cannot move an entry.
#
# `NominalDecl` hashes and orders on its module path and name. Its constructors sit in a
# `OnceCell` set once, after the head is declared, and no hash or comparison reads them.
#
# `SolverVar` hashes and compares on its `uid` alone. Its telescope holds the scope's opaque set in
# a `RefCell`, which no hash or comparison reads.
ignore-interior-mutability = [
    "cambra::ccl::ty::WitnessId",
    "cambra::ccl::nominal::NominalDecl",
    "cambra::ccl::infer::solver::var::SolverVar",
]
