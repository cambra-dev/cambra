large-error-threshold = 144

# `WitnessId` hashes and orders on `(spelling, uid, position)` — plain integers. A
# `Pending` reaches a `FunKindVar`'s `RefCell` through an `Rc`, and nothing that keys a
# set or map ever reads it, so the interior mutability cannot move an entry.
#
# `NominalDecl` hashes and orders on its module path and name. Its constructors sit in a
# `OnceCell` set once, after the head is declared, and no hash or comparison reads them.
ignore-interior-mutability = ["cambra::ccl::ty::WitnessId", "cambra::ccl::nominal::NominalDecl"]
