[workspace]
# The root `cambra` package is implicitly a workspace member; `cambra-inspector`
# is the second member. Splitting serde + the inspector HTTP/frontend into a
# separate crate is what keeps `cargo build -p cambra` serde-free: serde is an
# optional, default-off feature here, pulled in only when `cambra-inspector`
# (or `--features serde`) builds it. See projects/program-inspector/m1-static-plan.md §2.
members = ["cambra-inspector"]
# The root package is edition 2024, whose default resolver is 3, but a workspace
# table overrides the member's edition default — so leaving this unset or at 2
# silently downgrades the whole build. 3 is MSRV-aware version selection (it
# respects `rust-version` when picking a dependency version); the feature
# unification `ci_clippy_serde` and `ci_clippy_lib` rely on arrived in 2 and is
# unchanged in 3, so those gates are not what this setting decides.
resolver = "3"

[package]
name = "cambra"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "A programming language with a dependently-typed functional core and streaming-dataflow execution"
repository = "https://github.com/cambra-dev/cambra"
readme = "README.md"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
# Expose test-only helpers (counter resets, etc.) to integration tests that
# link against the compiled library. Add `cambra = { features = ["test-helpers"] }`
# to a crate's dev-dependencies to enable.
test-helpers = []

# Run the *per-operation* post-rewrite typecheck ([`debug_typecheck`]) that
# pass-internal helpers (lambda elimination, substitution, simplify) invoke
# after each rewrite. It is a debugging aid that localizes *which* operation
# first produced an ill-typed tree; `compile_program`'s pass-boundary
# `check_pre_desugar` walls remain the always-on correctness net. Off by default
# (even in debug): the check is O(subtree) and fires per rewrite, so on nested
# comprehensions it was superlinear and dominated debug/test compile time.
# Enable when bisecting a miscompile: `cargo test --features deep-typecheck`.
deep-typecheck = []

# Optional, default-OFF. Enables `Serialize`/`Deserialize` on the inspector wire
# types, via `#[cfg_attr(feature = "serde", ...)]` at each site.
# `cambra-inspector` turns this on; plain `cambra` builds compile zero serde.
serde = ["dep:serde"]

[dev-dependencies]
# Self dev-dependency so the integration tests (separate crates) can see the
# `test-helpers`-gated helpers. Cargo unifies this with the library under test.
cambra = { path = ".", features = ["test-helpers"] }
microbench = "0.5.0"
rstest = { version = "0.26.1", features = ["async-timeout"] }
rstest-log = "0.2.0"
test-log = "0.2.19"

[dependencies]
# CHL parser stack. See src/chl_parser/design-chl-parser.md.
chumsky = "1.0.0-alpha.8"
logos = "0.14"
ariadne = "0.4"
indoc = "1.0"
log = "0.4.29"
env_logger = "0.11.9"
tiny_http = "0.12"
bit-set = "0.8.0"
bit-vec = "0.8.0"
intervalsets = "0.1.0-alpha.2"
# Pinned to the version `intervalsets` already pulls in, so the tree builds one copy.
itertools = "0.13"
smol_str = "0.3.6"
stacker = "0.1"
# Optional: gated behind the `serde` feature (default off). The inspector wire
# types derive `Serialize` only when `cambra-inspector` enables it. serde_json
# (the transport-edge (de)serializer) lives in `cambra-inspector`, not here.
serde = { version = "1", features = ["derive"], optional = true }

[profile.release]
debug = "line-tables-only"