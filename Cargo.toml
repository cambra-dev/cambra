[package]
name = "cambra"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dev-dependencies]
microbench = "0.5.0"
rstest = { version = "0.26.1", features = ["async-timeout"] }
rstest-log = "0.2.0"
test-log = "0.2.19"

[dependencies]
rustpython-ast = { version = "0.2.0", features = ["unparse"] }
rustpython-parser = "0.2.0"
indoc = "1.0"
log = "0.4.29"
env_logger = "0.11.9"
tiny_http = "0.12"
bit-set = "0.8.0"
bit-vec = "0.8.0"
intervalsets = "0.1.0-alpha.2"
smol_str = "0.3.6"

[profile.release]
debug = "line-tables-only"