[workspace]
# The root package plus the CHL parser and the differential interpreter. The
# inspector's Rust half is `src/inspector_server`, a module of this crate;
# `web/` is its TypeScript frontend, a JS project with no Cargo manifest.
# The root package is edition 2024, whose default resolver is 3, but a workspace
# table overrides the member's edition default — so leaving this unset or at 2
# silently downgrades the whole build. 3 is MSRV-aware version selection (it
# respects `rust-version` when picking a dependency version); feature
# unification arrived in 2 and is unchanged in 3, so no gate depends on this
# setting.
resolver = "3"
members = ["chl-parser", "chl-interp", "cambra-lsp"]
# A bare `cargo test` or `cargo clippy` at the root covers every member.
default-members = [".", "chl-parser", "chl-interp", "cambra-lsp"]

[package]
name = "cambra"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "A programming language with a dependently-typed functional core and streaming-dataflow execution"
repository = "https://github.com/cambra-dev/cambra"
readme = "README.md"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
# Expose the compact-type merges `CompactType::merge_bounds` and `CompactTypeKind::merge_kinds`
# to the differential oracle (`[[test]]` below), which links the compiled library rather than
# being part of its test build, and requires this feature. Every other test-only item is
# `cfg(test)`: the suite is the library's test build.
test-helpers = []
# Turn on `REFINE_OPS` (`src/ccl/ops.rs`): every operator with a `^` sibling refines its
# result as that sibling does. Temporary scaffolding, removed with the `^` siblings
# (`src/ccl/design/type-inference.md`, "An operator is refined by the operation it computes").
refine-ops = []

[dev-dependencies]
# The differential interpreter, for the differential suite. A dev-dependency because only the
# tests compare the two; the library must not consult the interpreter it is checked against.
chl-interp = { path = "chl-interp" }
# Runs the test executable as the `cambra` command line before libtest's `main` when a test
# spawns it (`tests/it/mod.rs`, `cli`).
ctor = "1.0.14"
# The command line ignores `SIGPIPE` as an executable's `main` would, which that early start
# precedes (`tests/it/mod.rs`, `cli`).
libc = "0.2.191"
microbench = "0.5.0"
rstest = { version = "0.26.1", features = ["async-timeout"] }
rstest-log = "0.2.0"
test-log = "0.2.19"

[dependencies]
# CHL parser, its own crate so a consumer can depend on the front end alone.
# See chl-parser/design-chl-parser.md.
chl-parser = { path = "chl-parser" }
# The language server `--lsp` runs. See cambra-lsp/design-cambra-lsp.md.
cambra-lsp = { path = "cambra-lsp" }
ariadne = "0.4"
easy-smt = "0.3.2"
indoc = "1.0"
log = "0.4.29"
env_logger = "0.11.9"
tiny_http = "0.12"
httpdate = "1"
bit-set = "0.8.0"
intervalsets = "0.1.0-alpha.2"
# Pinned to the version `intervalsets` already pulls in, so the tree builds one copy.
itertools = "0.13"
smol_str = { version = "0.3.6", features = ["serde"] }
stacker = "0.1"
# The inspector wire types (`src/inspector_model`) derive `Serialize`; the
# transport (`src/inspector_server`) renders them with `serde_json`. Both are
# unconditional: measured against a feature gate, the whole serde tree is ~7s of
# serial compile work that lands off this crate's critical path and costs nothing
# in wall-clock, while the gate cost a standing clippy configuration.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }

# Line tables only: backtraces, profilers and line breakpoints keep `file.rs:line`,
# and a debugger loses variables, arguments and types. Full debug info is ~80% of
# a test binary, and every test binary links the whole library, so it is most of
# `target/`: 12G of it at full against 5.0G here. `CARGO_PROFILE_DEV_DEBUG=full`
# turns it back on for a debugging session (`CLAUDE.md`, "Debug symbols").
# Stripping only the dependencies is not the saving: nearly all of it is this
# workspace's own crates.
[profile.dev]
debug = "line-tables-only"

[profile.release]
debug = "line-tables-only"

# `dev`'s compile cost with `debug_assertions` off — the configuration a release
# build compiles, without paying release codegen. `debug-assertions` is a codegen
# flag rather than a runtime one, so this is its own build tree and shares no
# artifacts with `debug`. Optimization is beside the point for what the gate that
# uses it checks (`ci_test_no_assertions`): it stays at `dev`'s, and GitHub's job
# raises it to `opt-level=1` for speed alone.
[profile.no-assertions]
inherits = "dev"
debug-assertions = false
overflow-checks = false
# No one runs a debugger on this tree: 11G with full debug info, 2.7G without.
debug = false

# The suite is the library's own test build: `tests/it/mod.rs` is a `cfg(test)` module of the
# library (`src/lib.rs`), so one compile of the library carries its unit tests and the
# integration tests both. A target linking the library instead would need a second compile of
# it, so every top-level `tests/*.rs` is declared here with the reason it cannot be part of
# the suite; `tests/it/test_layout.rs` fails on one that is not.
#
# The executable's tests would be such a target, and it has none: its `main` only calls
# `cambra::cli::main`, and the suite runs the command line as the test executable.
# Doctests are the same kind of target: rustdoc compiles each against the library built
# without `cfg(test)`. An example a test should check goes in the suite instead.
[lib]
doctest = false

[[bin]]
name = "cambra"
path = "src/main.rs"
test = false
# The differential oracle belongs to the formal gate, not to the suite. It runs
# `formal/.lake/build/bin/subverdict` and refuses to skip under CI, so a job
# that runs the suite would need the whole Lean toolchain to check something
# `ci.sh formal` already checks. `test = false` keeps it out of a bare
# `cargo test`; `cargo test --features test-helpers --test differential_oracle`, which is
# what `ci_formal` runs, still names it explicitly and builds it.
[[test]]
name = "differential_oracle"
test = false
required-features = ["test-helpers"]
