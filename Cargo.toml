[workspace]
# One package. The inspector's Rust half is `src/inspector_server`, a module of
# this crate; `web/` is its TypeScript frontend, a JS project
# with no Cargo manifest.
# The root package is edition 2024, whose default resolver is 3, but a workspace
# table overrides the member's edition default — so leaving this unset or at 2
# silently downgrades the whole build. 3 is MSRV-aware version selection (it
# respects `rust-version` when picking a dependency version); the feature
# unification `ci_clippy_lib` relies on arrived in 2 and is unchanged in 3, so
# that gate is not what this setting decides.
resolver = "3"

[package]
name = "cambra"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "A programming language with a dependently-typed functional core and streaming-dataflow execution"
repository = "https://github.com/cambra-dev/cambra"
readme = "README.md"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
# Expose test-only helpers (counter resets, etc.) to integration tests that
# link against the compiled library. Add `cambra = { features = ["test-helpers"] }`
# to a crate's dev-dependencies to enable.
test-helpers = []

# Run the *per-operation* post-rewrite typecheck ([`debug_typecheck`]) that
# pass-internal helpers (lambda elimination, substitution, simplify) invoke
# after each rewrite. It is a debugging aid that localizes *which* operation
# first produced an ill-typed tree; `compile_program`'s pass-boundary
# `check_pre_desugar` walls remain the always-on correctness net. Off by default
# (even in debug): the check is O(subtree) and fires per rewrite, so on nested
# comprehensions it was superlinear and dominated debug/test compile time.
# Enable when bisecting a miscompile: `cargo test --features deep-typecheck`.
deep-typecheck = []

[dev-dependencies]
# Self dev-dependency so the integration tests (separate crates) can see the
# `test-helpers`-gated helpers. Cargo unifies this with the library under test.
cambra = { path = ".", features = ["test-helpers"] }
microbench = "0.5.0"
rstest = { version = "0.26.1", features = ["async-timeout"] }
rstest-log = "0.2.0"
test-log = "0.2.19"

[dependencies]
# CHL parser stack. See src/chl_parser/design-chl-parser.md.
chumsky = "1.0.0-alpha.8"
logos = "0.14"
ariadne = "0.4"
easy-smt = "0.3.2"
indoc = "1.0"
log = "0.4.29"
env_logger = "0.11.9"
bit-set = "0.8.0"
bit-vec = "0.8.0"
intervalsets = "0.1.0-alpha.2"
# Pinned to the version `intervalsets` already pulls in, so the tree builds one copy.
itertools = "0.13"
smol_str = "0.3.6"
stacker = "0.1"
# The inspector wire types (`src/inspector_model`) derive `Serialize`; the
# transport (`src/inspector_server`) renders them with `serde_json`. Both are
# unconditional: measured against a feature gate, the whole serde tree is ~7s of
# serial compile work that lands off this crate's critical path and costs nothing
# in wall-clock, while the gate cost a standing clippy configuration.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The socket half of the crate. `tiny_http` is the inspector's HTTP server and
# `http_serve`'s listener; `tungstenite` is the live-values websocket. Neither
# can exist on a target with no sockets, and `tungstenite` cannot even be
# *built* for one — it pulls `rand` and then `getrandom`, which refuses
# `wasm32-unknown-unknown` without a backend chosen at link time.
#
# Scoped by target rather than by a Cargo feature deliberately. A feature adds a
# standing configuration every clippy pass has to cover (`Cargo.toml`'s serde
# note records the same decision), and it lets a native build turn the server
# off, which nothing wants. A target table is not a build variant: it says these
# crates do not exist on that platform, which is the fact.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tiny_http = "0.12"
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
serde-wasm-bindgen = "0.6"

[lib]
# `cdylib` is the WebAssembly module; `rlib` keeps the binary and the test
# crates linking against the same library.
crate-type = ["cdylib", "rlib"]

[profile.release]
debug = "line-tables-only"

# The WebAssembly module, which is a file a page downloads rather than a binary
# a machine runs, so it is optimized for size where `release` is optimized for
# speed. A separate profile rather than a change to `release`: the demo program
# is on a per-row time budget natively too, and `opt-level = "z"` would spend it.
#
# `debug = false` is the big one — `release`'s line tables are most of an
# unoptimized module's bytes. `panic = "abort"` drops the unwinding tables; a
# panic in a module reaches the page as a trap either way, and
# `console_error_panic_hook` reports it before that.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
debug = false
strip = true
