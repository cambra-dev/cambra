<!DOCTYPE html>
<html lang="en">

<!-- Colors
 #10253a Abyssal
 #054350 Deep Sea
 #1c88a7 Ocean
 #6cc4c8 Lagoon
 #c5e3db San Blas
 #d75a2e Ember
 #f18840 Coral
 #f5a337 Amber
 #fff0d1 Sand
-->


<head>
    <meta charset="utf-8">
    <title>Cambra Inspector</title>
    <style>
        :root {
            /* Brand colors */
            --color-abyssal: #10253a;
            --color-deep-sea: #054350;
            --color-ocean: #1c88a7;
            --color-lagoon: #6cc4c8;
            --color-san-blas: #c5e3db;
            --color-ember: #d75a2e;
            --color-coral: #f18840;
            --color-amber: #f5a337;
            --color-sand: #fff0d1;

            /* Other colors */
            --color-dark-grey: #45475a;

            /* UI colors */
            --color-bg-body: var(--color-abyssal);
            --color-text-primary: var(--color-sand);
            --color-text-secondary: var(--color-ember);
            --color-text-annotation: var(--color-lagoon);
            --color-text-error: var(--color-amber);
            --color-button-bg: var(--color-ocean);
            --color-border-container: var(--color-deep-sea);
            --color-border-divider: var(--color-dark-grey);

            /* SVG/Graph colors */
            --color-svg-bg: var(--color-abyssal);
            --color-node-fill: var(--color-deep-sea);
            --color-node-border-default: var(--color-dark-grey);
            --color-node-border-active: var(--color-amber);
            --color-edge-stroke: var(--color-dark-grey);
            --color-edge-label-bg: var(--color-abyssal);
            --color-edge-label-text: var(--color-amber);
            --color-node-title: var(--color-ember);
            --color-node-tiling: var(--color-sand);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'SF Mono', 'Menlo', 'Monaco', monospace;
            font-size: 13px;
            background: var(--color-bg-body);
            color: var(--color-text-primary);
            padding: 16px;
        }

        h1 {
            font-size: 18px;
            margin-bottom: 12px;
            color: var(--color-text-secondary);
        }

        .tick {
            color: var(--color-text-primary);
            margin-bottom: 12px;
        }

        .section {
            margin-top: 16px;
        }

        .section-title {
            color: var(--color-text-secondary);
            font-size: 14px;
            margin-bottom: 8px;
            border-bottom: 1px solid var(--color-border-divider);
            padding-bottom: 4px;
        }

        #error {
            color: var(--color-text-error);
            margin: 8px 0;
        }

        #producer-container {
            overflow: auto;
            border: 1px solid var(--color-border-container);
            border-radius: 4px;
        }

        #refresh {
            background: var(--color-button-bg);
            color: var(--color-bg-body);
            border: none;
            padding: 6px 16px;
            border-radius: 4px;
            font-family: inherit;
            font-size: 13px;
            cursor: pointer;
            margin-bottom: 12px;
        }

        .pre-content {
            margin-top: 8px;
            overflow-x: auto;
            color: var(--color-text-primary);
        }

        .producer-div {
            line-height: 0;
        }

        .none-text {
            padding: 8px;
            color: var(--color-text-annotation);
        }
    </style>
</head>

<body>
    <h1>Cambra Runtime Inspector</h1>
    <button id="refresh" onclick="poll()">Refresh</button>
    <div class="tick" id="tick">Tick: --</div>
    <div id="error"></div>
    <div class="section">
        <details open>
            <summary class="section-title" style="cursor:pointer;">Python AST</summary>
            <pre id="ast" class="pre-content">Loading…</pre>
        </details>
    </div>
    <div class="section">
        <details open>
            <summary class="section-title" style="cursor:pointer;">CCL Operator Graph</summary>
            <pre id="operators" class="pre-content">Loading…</pre>
        </details>
    </div>
    <div class="section">
        <div class="section-title">Producer Graph</div>
        <div id="producer-container">
            <div id="producer" class="producer-div"></div>
        </div>
    </div>
    <script>
        // ── XML escaping for SVG text content ────────────────────────────────
        function esc(s) {
            return String(s)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        // ── Helpers for identifying back-reference split nodes ────────────────
        // Primary split nodes have labels like   "Split#<hex>"
        // Back-references have labels like       "→ Split#<hex>"
        function isSplitRef(label) { return label.startsWith('\u2192 Split#'); }
        function splitId(label) {
            // Works for both "Split#<id>" and "→ Split#<id>"
            const idx = label.indexOf('Split#');
            return idx >= 0 ? label.slice(idx + 6) : null;
        }

        // ── Layout constants ─────────────────────────────────────────────────
        const NODE_W = 188;  // node box width
        const TILING_LW = 24;   // approximate chars that fit on one tiling line
        const H_GAP = 24;   // minimum horizontal gap between sibling subtrees
        const V_GAP = 56;   // vertical gap between levels
        const PAD = 20;   // canvas padding

        // ── Per-node height based on how many lines the tiling wraps to ───────
        // Title always occupies the first 26px; each additional tiling line
        // adds 13px with 8px of bottom padding.
        function nodeHeight(node) {
            const n = tilingLines(node.tiling || '').length;
            return n === 0 ? 34 : 26 + n * 13 + 8;
        }

        // ── Wrap a tiling string into lines at natural break points ───────────
        // Breaks preferentially after '→' or at spaces; falls back to a hard
        // break when no whitespace is found within the limit.
        function tilingLines(text) {
            if (!text) return [];
            const lines = [];
            let rem = text;
            while (rem.length > TILING_LW) {
                // Prefer breaking just after '→' (inclusive, so the arrow stays on its line)
                const arrowIdx = rem.lastIndexOf('\u2192', TILING_LW);
                let bp = arrowIdx > 0 ? arrowIdx + 1 : rem.lastIndexOf(' ', TILING_LW);
                if (bp <= 0) bp = TILING_LW;  // hard break
                lines.push(rem.slice(0, bp).trimEnd());
                rem = rem.slice(bp).trimStart();
            }
            if (rem) lines.push(rem);
            return lines;
        }

        // ── Bottom-up: measure the minimum width each subtree needs ───────────
        // Back-reference split nodes are collapsed into cross-edges, so they
        // don't contribute width to their parent's subtree.
        function subtreeWidth(node) {
            const realChildren = (node.children || []).filter(c => !isSplitRef(c.node.label));
            if (realChildren.length === 0) return NODE_W;
            const childTotal = realChildren.reduce((sum, c) => sum + subtreeWidth(c.node), 0);
            const gaps = H_GAP * (realChildren.length - 1);
            return Math.max(NODE_W, childTotal + gaps);
        }

        // ── Depth assignment (phase 1): DFS, ignoring split back-references ─────
        function assignDepths(node, depth) {
            node._depth = Math.max(node._depth ?? 0, depth);
            const realChildren = (node.children || []).filter(c => !isSplitRef(c.node.label));
            for (const c of realChildren) assignDepths(c.node, depth + 1);
        }

        // ── Depth constraint (phase 2): push any consumer below its split ────
        // A node that references Split#X must sit strictly deeper than Split#X,
        // otherwise the cross-edge would have to travel sideways or upward.
        function pushDown(node, delta) {
            node._depth += delta;
            const realChildren = (node.children || []).filter(c => !isSplitRef(c.node.label));
            for (const c of realChildren) pushDown(c.node, delta);
        }

        function enforceDepthConstraints(node, splitMap) {
            for (const c of (node.children || [])) {
                if (isSplitRef(c.node.label)) {
                    const split = splitMap.get(splitId(c.node.label));
                    if (split && split._depth <= node._depth)
                        pushDown(split, node._depth - split._depth + 1);
                }
            }
            const realChildren = (node.children || []).filter(c => !isSplitRef(c.node.label));
            for (const c of realChildren) enforceDepthConstraints(c.node, splitMap);
        }

        // ── Y assignment (phase 3): compute row tops from actual node heights ──
        // Each depth level's y-offset equals the sum of all preceding rows'
        // heights (max per level) plus inter-level gaps.
        function computeYPositions(nodes) {
            const rowH = new Map();
            for (const n of nodes)
                rowH.set(n._depth, Math.max(rowH.get(n._depth) ?? 0, nodeHeight(n)));
            const maxDepth = Math.max(...nodes.map(n => n._depth));
            const rowY = [0];
            for (let d = 0; d < maxDepth; d++)
                rowY.push(rowY[d] + (rowH.get(d) ?? 34) + V_GAP);
            for (const n of nodes)
                n._y = rowY[n._depth];
        }

        // ── X assignment (phase 4): centre each node over its real children ──
        function assignX(node, cx) {
            node._cx = cx;
            const realChildren = (node.children || []).filter(c => !isSplitRef(c.node.label));
            if (realChildren.length === 0) return;

            const widths = realChildren.map(c => subtreeWidth(c.node));
            const total = widths.reduce((a, b) => a + b, 0) + H_GAP * (widths.length - 1);
            let x = cx - total / 2;
            for (let i = 0; i < realChildren.length; i++) {
                assignX(realChildren[i].node, x + widths[i] / 2);
                x += widths[i] + H_GAP;
            }
        }

        // ── Flatten the tree into node and edge arrays ────────────────────────
        // Back-reference children are recorded as unresolved cross-edges;
        // the to-node is filled in after all real nodes have been laid out.
        function collectAll(node, nodes, edges) {
            nodes.push(node);
            if (!node.children) return;
            for (const c of node.children) {
                if (isSplitRef(c.node.label)) {
                    // Deferred cross-edge: target resolved after layout via split map
                    edges.push({
                        from: node,
                        to: null,
                        splitRefId: splitId(c.node.label),
                        label: c.edge || '',
                    });
                } else {
                    edges.push({ from: node, to: c.node, label: c.edge || '' });
                    collectAll(c.node, nodes, edges);
                }
            }
        }


        // ── Helper to get CSS variable value ──────────────────────────────────
        function getCSSVarColor(varName) {
            return getComputedStyle(document.documentElement).getPropertyValue(varName).trim();
        }

        // ── Build the SVG string for a producer tree ──────────────────────────
        function buildSvgGraph(root) {
            // 1. Assign initial tree depths
            assignDepths(root, 0);

            // 2. Collect nodes so we can build the split map before layout
            const nodes = [], edges = [];
            collectAll(root, nodes, edges);

            // 3. Build split map and enforce depth constraints so every consumer
            //    sits strictly below the split node it references
            const splitMap = new Map();
            for (const n of nodes) {
                const id = splitId(n.label);
                if (id && !isSplitRef(n.label)) splitMap.set(id, n);
            }
            enforceDepthConstraints(root, splitMap);

            // 4. Assign x positions and compute y from actual node heights
            const totalW = subtreeWidth(root);
            assignX(root, totalW / 2);
            computeYPositions(nodes);

            // 5. Resolve deferred cross-edges
            for (const e of edges) {
                if (e.splitRefId) e.to = splitMap.get(e.splitRefId) ?? null;
            }

            // 6. Compute canvas bounds
            const minX = Math.min(...nodes.map(n => n._cx)) - NODE_W / 2;
            const maxX = Math.max(...nodes.map(n => n._cx)) + NODE_W / 2;
            const maxY = Math.max(...nodes.map(n => n._y + nodeHeight(n)));
            const svgW = maxX - minX + 2 * PAD;
            const svgH = maxY + 2 * PAD;
            const ox = PAD - minX;   // layout → SVG x offset
            const oy = PAD;          // layout → SVG y offset

            // Resolve colors from CSS variables
            const colors = {
                svgBg: getCSSVarColor('--color-svg-bg'),
                edgeStroke: getCSSVarColor('--color-edge-stroke'),
                edgeLabelBg: getCSSVarColor('--color-edge-label-bg'),
                edgeLabelText: getCSSVarColor('--color-edge-label-text'),
                nodeFill: getCSSVarColor('--color-node-fill'),
                nodeBorderDefault: getCSSVarColor('--color-node-border-default'),
                nodeBorderActive: getCSSVarColor('--color-node-border-active'),
                nodeTitle: getCSSVarColor('--color-node-title'),
                nodeTiling: getCSSVarColor('--color-node-tiling'),
                textAnnotation: getCSSVarColor('--color-text-annotation'),
            };

            // 5. Generate SVG
            let s = `<svg xmlns="http://www.w3.org/2000/svg" width="${svgW}" height="${svgH}" `
                + `style="font-family:'SF Mono',Menlo,Monaco,monospace;display:block;">`;

            s += `<rect width="${svgW}" height="${svgH}" fill="${colors.svgBg}"/>`;

            // ── Edges (drawn first so they sit behind nodes) ──────────────────
            for (const e of edges) {
                if (!e.to) continue;   // unresolvable cross-edge (shouldn't happen)

                // Normal edges: bottom of parent → top of child.
                // Split cross-edges: top of split node → bottom of consumer.
                // (e.from = consumer, e.to = split for cross-edges)
                const x1 = e.splitRefId ? e.to._cx + ox : e.from._cx + ox;
                const y1 = e.splitRefId ? e.to._y + oy : e.from._y + oy + nodeHeight(e.from);
                const x2 = e.splitRefId ? e.from._cx + ox : e.to._cx + ox;
                const y2 = e.splitRefId ? e.from._y + oy + nodeHeight(e.from) : e.to._y + oy;

                {
                    // Solid gray bezier with symmetric control points.
                    // Midpoint of this curve is exactly ((x1+x2)/2, (y1+y2)/2).
                    const cm = (y1 + y2) / 2;
                    s += `<path d="M${x1},${y1} C${x1},${cm} ${x2},${cm} ${x2},${y2}" `
                        + `fill="none" stroke="${colors.edgeStroke}" stroke-width="1.5"/>`;
                    if (e.label) {
                        const lx = (x1 + x2) / 2;
                        const ly = (y1 + y2) / 2;
                        const fw = e.label.length * 6.5 + 6;
                        s += `<rect x="${lx - fw / 2}" y="${ly - 8}" width="${fw}" height="13" rx="2" fill="${colors.edgeLabelBg}"/>`;
                        s += `<text x="${lx}" y="${ly + 3}" text-anchor="middle" `
                            + `fill="${colors.edgeLabelText}" font-size="10">${esc(e.label)}</text>`;
                    }
                }
            }

            // ── Nodes ─────────────────────────────────────────────────────────
            for (const n of nodes) {
                const nx = n._cx + ox - NODE_W / 2;
                const ny = n._y + oy;
                const cx = n._cx + ox;
                // Border highlights active nodes (yield guard present and not complete)
                const yg = n.yield_guard;
                const borderColor = (yg && yg !== '\u2205' && yg !== '*') ? colors.nodeBorderActive : colors.nodeBorderDefault;
                s += `<rect x="${nx}" y="${ny}" width="${NODE_W}" height="${nodeHeight(n)}" rx="5" `
                    + `fill="${colors.nodeFill}" stroke="${borderColor}" stroke-width="1"/>`;

                // Line 1: type name (before first '(')
                const parenIdx = n.label.indexOf('(');
                // Line 1 title: type name + inline annotations (e.g. "(Sum)")
                const typeName = parenIdx >= 0 ? n.label.slice(0, parenIdx) : n.label;
                const args = parenIdx >= 0 ? n.label.slice(parenIdx) : '';
                const annInline = (n.annotations && n.annotations.length > 0)
                    ? ' ' + n.annotations.join(' ')
                    : '';
                const titleText = typeName + (args || '') + annInline;
                s += `<text x="${cx}" y="${ny + 18}" text-anchor="middle" font-size="12">`
                    + `<tspan fill="${colors.nodeTitle}" font-weight="bold">${esc(typeName + (args || ''))}</tspan>`;
                if (annInline)
                    s += `<tspan fill="${colors.textAnnotation}" font-size="11">${esc(annInline)}</tspan>`;
                s += `</text>`;

                // Line 2+: tiling, wrapped
                const tlines = tilingLines(n.tiling || '');
                for (let i = 0; i < tlines.length; i++) {
                    s += `<text x="${cx}" y="${ny + 35 + i * 13}" text-anchor="middle" `
                        + `fill="${colors.nodeTiling}" font-size="11">${esc(tlines[i])}</text>`;
                }

            }

            s += '</svg>';
            return s;
        }

        // ── Polling ───────────────────────────────────────────────────────────
        async function poll() {
            try {
                const r = await fetch('/api/snapshot');
                const data = await r.json();
                document.getElementById('tick').textContent = 'Tick: ' + data.tick;
                document.getElementById('producer').innerHTML =
                    data.producer
                        ? buildSvgGraph(data.producer)
                        : '<em class="none-text">none</em>';
                document.getElementById('error').textContent = '';
            } catch (e) {
                document.getElementById('error').textContent = 'Connection error: ' + e.message;
            }
        }

        poll();
        fetch('/api/ast').then(r => r.text()).then(t => { document.getElementById('ast').textContent = t; });
        fetch('/api/operators').then(r => r.text()).then(t => { document.getElementById('operators').textContent = t; });
    </script>
</body>

</html>
