<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" width="700" role="img"
     font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <title>A branch table and the operator graph it holds</title>
  <desc>An operator graph beside the branch table that holds it. Ocean nodes r1, r2 and r3 are the
  production branch's chain. r2 also feeds two ember nodes, o1 for branch v3 and g1 for branch v1,
  so r2's fan-out has a slot for each of r3, o1 and g1. r1 also feeds an ember chain b1 to b2 for
  branch v2. The table lists each branch with the operators it holds: production r1, r2, r3; v1
  r1, r2, g1; v2 r1, b1, b2; v3 r1, r2, o1. r1 appears in every row and r2 in three, because a
  branch holds the operators it shares with its origin rather than copies of them.</desc>

  <defs>
    <marker id="ah-ocean" viewBox="0 0 10 10" refX="9.6" refY="5"
            markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1C88A7"/>
    </marker>
    <marker id="ah-ember" viewBox="0 0 10 10" refX="9.6" refY="5"
            markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#D75A2E"/>
    </marker>
  </defs>

  <!-- ── operator graph ─────────────────────────────────────────────────── -->
  <text x="12" y="24" font-size="13" fill="#6B7A8A">operator graph</text>

  <path d="M170 78 V132" stroke="#1C88A7" stroke-width="3" fill="none" marker-end="url(#ah-ocean)"/>
  <path d="M185.7 68.8 L314.3 141.2" stroke="#D75A2E" stroke-width="3" fill="none" marker-end="url(#ah-ember)"/>
  <path d="M170 168 V222" stroke="#1C88A7" stroke-width="3" fill="none" marker-end="url(#ah-ocean)"/>
  <path d="M158 163.4 L102 226.6" stroke="#D75A2E" stroke-width="3" fill="none" marker-end="url(#ah-ember)"/>
  <path d="M182 163.4 L238 226.6" stroke="#D75A2E" stroke-width="3" fill="none" marker-end="url(#ah-ember)"/>
  <path d="M330 168 V222" stroke="#D75A2E" stroke-width="3" fill="none" marker-end="url(#ah-ember)"/>

  <circle cx="170" cy="60" r="18" stroke="#1C88A7" stroke-width="2" fill="none"/>
  <text x="170" y="64" font-size="11" fill="#1C88A7" text-anchor="middle">r1</text>
  <circle cx="170" cy="150" r="18" stroke="#1C88A7" stroke-width="2" fill="none"/>
  <text x="170" y="154" font-size="11" fill="#1C88A7" text-anchor="middle">r2</text>
  <circle cx="170" cy="240" r="18" stroke="#1C88A7" stroke-width="2" fill="none"/>
  <text x="170" y="244" font-size="11" fill="#1C88A7" text-anchor="middle">r3</text>
  <text x="170" y="276" font-size="12.5" fill="#1C88A7" text-anchor="middle">production</text>

  <circle cx="90" cy="240" r="18" stroke="#D75A2E" stroke-width="2" fill="none"/>
  <text x="90" y="244" font-size="11" fill="#D75A2E" text-anchor="middle">o1</text>
  <text x="90" y="276" font-size="12.5" fill="#D75A2E" text-anchor="middle">v3</text>

  <circle cx="250" cy="240" r="18" stroke="#D75A2E" stroke-width="2" fill="none"/>
  <text x="250" y="244" font-size="11" fill="#D75A2E" text-anchor="middle">g1</text>
  <text x="250" y="276" font-size="12.5" fill="#D75A2E" text-anchor="middle">v1</text>

  <circle cx="330" cy="150" r="18" stroke="#D75A2E" stroke-width="2" fill="none"/>
  <text x="330" y="154" font-size="11" fill="#D75A2E" text-anchor="middle">b1</text>
  <circle cx="330" cy="240" r="18" stroke="#D75A2E" stroke-width="2" fill="none"/>
  <text x="330" y="244" font-size="11" fill="#D75A2E" text-anchor="middle">b2</text>
  <text x="330" y="276" font-size="12.5" fill="#D75A2E" text-anchor="middle">v2</text>

  <text x="12" y="314" font-size="11.5" fill="#6B7A8A">r2's fan-out has one slot per reader: r3, o1, g1</text>

  <path d="M400 44 V300" stroke="#6B7A8A" stroke-width="1" fill="none" opacity="0.35"/>

  <!-- ── branch table ───────────────────────────────────────────────────── -->
  <text x="432" y="24" font-size="13" fill="#6B7A8A">branch table</text>

  <text x="432" y="80" font-size="12.5" fill="#1C88A7">production</text>
  <text x="548" y="80" font-size="12.5" fill="#6B7A8A">r1, r2, r3</text>
  <text x="432" y="118" font-size="12.5" fill="#D75A2E">v1</text>
  <text x="548" y="118" font-size="12.5" fill="#6B7A8A">r1, r2, g1</text>
  <text x="432" y="156" font-size="12.5" fill="#D75A2E">v2</text>
  <text x="548" y="156" font-size="12.5" fill="#6B7A8A">r1, b1, b2</text>
  <text x="432" y="194" font-size="12.5" fill="#D75A2E">v3</text>
  <text x="548" y="194" font-size="12.5" fill="#6B7A8A">r1, r2, o1</text>

  <text x="432" y="314" font-size="11.5" fill="#6B7A8A">a shared operator is held, not copied</text>
</svg>
